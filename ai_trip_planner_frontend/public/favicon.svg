<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" />

  <!-- Dotted Orbit Arc -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#60a5fa" stroke-width="8" stroke-dasharray="16 16" opacity="0.6" />

  <!-- Dynamic Location Trail -->
  <path d="M160 352 C 180 260, 240 200, 352 160" fill="none" stroke="#93c5fd" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />

  <!-- Airplane Icon -->
  <path d="M352 160 L280 232 L260 200 L236 224 L260 260 L212 308 L180 292 L164 308 L204 348 L244 388 L260 372 L244 340 L292 292 L328 316 L352 292 L320 272 Z" fill="url(#planeGrad)" />
  
  <!-- Location Pin Sparkle -->
  <circle cx="160" cy="352" r="16" fill="#38bdf8" filter="url(#glow)" />
</svg>
